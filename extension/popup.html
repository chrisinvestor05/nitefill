<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Nitefill Sender</strong>
      <span id="badge">…</span>
    </header>
    <p id="ig">Looking for Instagram…</p>
    <p id="job"></p>
    <p id="err"></p>
    <label class="row">
      <input type="checkbox" id="enabled" checked />
      Send while Instagram is open
    </label>
    <button id="tick">Work now</button>
    <details id="manual">
      <summary>Pair manually</summary>
      <input id="pair" placeholder="Paste pairing code from Nitefill" />
      <button id="pairbtn" type="button">Pair</button>
    </details>
    <p class="hint">
      Open Nitefill in a Chrome tab (not a preview frame). Keep Instagram signed in.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
