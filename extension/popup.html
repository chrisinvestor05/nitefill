<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Nitefill Sender</strong>
      <span id="badge">…</span>
    </header>
    <p id="ig">Looking for Instagram…</p>
    <p id="job"></p>
    <p id="err"></p>
    <label class="row">
      <input type="checkbox" id="enabled" checked />
      Send while Instagram is open
    </label>
    <button id="tick">Send next now</button>
    <p class="hint">
      Keep this Chrome signed into Instagram. Pairing happens automatically when you open your Nitefill dashboard.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
